
<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>भारतीय संविधान टेस्ट - KGK</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <div class="logo"><h2>KGK</h2></div>
        <nav class="nav-links">
            <a href="index.html">होम</a>
        </nav>
    </header>

    <div class="container" style="max-width: 600px; margin-top: 50px;">
        <div class="card">
            <h4 style="color: #d35400;">विषय: भारतीय संविधान (Indian Polity)</h4>
            <hr>
            <h2 id="q-text" style="min-height: 80px;">सवाल लोड हो रहा है...</h2>
            
            <div id="options-box"></div>

            <button id="next-btn" class="btn-play" style="display:none; width: 100%; border: none; cursor: pointer;">अगला सवाल</button>

            <div id="result-box" style="display:none;">
                <h3 style="color: #2c3e50;">टेस्ट पूरा हुआ!</h3>
                <p style="font-size: 24px; font-weight: bold;">आपका स्कोर: <span id="score-val" style="color: #d35400;">0</span></p>
                <div style="display: flex; gap: 10px; justify-content: center;">
                    <button onclick="location.reload()" class="btn-play" style="background: #7f8c8d; border: none; cursor: pointer;">दोबारा दें</button>
                    <a href="index.html" class="btn-play" style="text-decoration: none;">होम पर जाएं</a>
                </div>
            </div>
        </div>
    </div>

    <script src="quiz.js"></script>

    <script>
        // भारतीय संविधान टैब का आपका विशिष्ट CSV लिंक
        const indPolitySheetURL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRXVXbbQVA_5tojtKMn0VRn_AHY_ZKkeyZ9HHAOvByexslRMfiGq_NXK--FeELRcR7Y5R75FVWc2NbT/pub?gid=1552925344&single=true&output=csv";

        window.onload = () => {
            // quiz.js के loadAutoQuestions फ़ंक्शन को कॉल करना
            if (typeof loadAutoQuestions === "function") {
                loadAutoQuestions(indPolitySheetURL);
            } else {
                console.error("quiz.js फाइल लोड नहीं हो पाई!");
            }
        };
    </script>
</body>
</html>
