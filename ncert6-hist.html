<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NCERT 6th History Quiz | KGK Online</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <div class="logo"><h2>KGK</h2></div>
        <nav class="nav-links">
            <a href="index.html">होम</a>
            <a href="ncert6-main.html">कक्षा 6 विषय</a>
        </nav>
    </header>

    <div class="container" style="max-width: 600px; margin-top: 30px;">
        <div class="card">
            <h4 style="color: #8e44ad;">NCERT कक्षा 6 - इतिहास (हमारे अतीत-I)</h4>
            
            <div id="quiz-header" style="display: flex; justify-content: space-between; font-size: 14px; color: #666; margin-bottom: 15px;">
                <span id="q-number">लोड हो रहा है...</span>
                <span id="score-live">स्कोर: 0</span>
            </div>
            
            <hr>

            <h2 id="q-text" style="min-height: 80px; font-size: 19px; color: #fff; margin-top: 20px;">
                सवाल लोड हो रहा है...
            </h2>
            
            <div id="options-box"></div>

            <button id="next-btn" class="btn-play" style="display:none; width: 100%; border: none; cursor: pointer; font-size: 18px; margin-top: 20px;">
                अगला सवाल
            </button>

            <div id="result-box" style="display:none; text-align: center;">
                <h2 style="color: #27ae60;">क्विज़ समाप्त!</h2>
                <p style="font-size: 24px; font-weight: bold; color: #fff;">आपका स्कोर: <span id="score-val">0</span></p>
                <div style="display: flex; flex-direction: column; gap: 10px; margin-top: 20px;">
                    <button onclick="location.reload()" class="btn-play" style="background: #3498db; border: none;">फिर से प्रयास करें</button>
                    <a href="index.html" class="btn-play" style="text-decoration: none; background: #7f8c8d;">मुख्य पृष्ठ पर जाएं</a>
                </div>
            </div>
        </div>
    </div>

    <script src="quiz.js"></script>

    <script>
        // आपका NCERT Class 6 History टैब का विशिष्ट CSV लिंक
        const ncertHistURL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRXVXbbQVA_5tojtKMn0VRn_AHY_ZKkeyZ9HHAOvByexslRMfiGq_NXK--FeELRcR7Y5R75FVWc2NbT/pub?gid=590221244&single=true&output=csv";

        window.onload = () => {
            // quiz.js के loadAutoQuestions फ़ंक्शन को कॉल करना
            if (typeof loadAutoQuestions === "function") {
                loadAutoQuestions(ncertHistURL);
            } else {
                console.error("quiz.js लोड नहीं हो पाया!");
                document.getElementById('q-text').innerText = "त्रुटी: quiz.js फ़ाइल नहीं मिली!";
            }
        };
    </script>
</body>
</html>
