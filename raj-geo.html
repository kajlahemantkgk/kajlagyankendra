<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>राजस्थान भूगोल टेस्ट | KGK</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
  
    <div class="container" style="max-width: 600px;">
        <div class="card">
            <h2 id="q-text">सवाल लोड हो रहा है...</h2>
            <div id="options-box"></div>
            <button id="next-btn" class="btn-play" style="display:none; width: 100%;">अगला सवाल</button>
            
            <div id="result-box" style="display:none;">
                <h2 class="section-title">क्विज़ पूरा हुआ!</h2>
                <h3>आपका स्कोर: <span id="score-val"></span></h3>
                <a href="index.html" class="btn-play" style="text-decoration: none; display: inline-block; margin-top: 10px;">होम पेज पर जाएं</a>
            </div>
        </div>
    </div>

    <script src="quiz.js"></script>

    <script>
        // आपका Google Sheet CSV लिंक
        const sheetURL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRXVXbbQVA_5tojtKMn0VRn_AHY_ZKkeyZ9HHAOvByexslRMfiGq_NXK--FeELRcR7Y5R75FVWc2NbT/pub?output=csv";

        // पेज लोड होते ही Google Sheet से सवाल उठाना
        window.onload = () => {
            if (typeof loadAutoQuestions === "function") {
                loadAutoQuestions(sheetURL);
            } else {
                console.error("Error: quiz.js लोड नहीं हुआ या loadAutoQuestions फंक्शन नहीं मिला।");
                document.getElementById('q-text').innerText = "सिस्टम एरर: quiz.js फाइल नहीं मिली।";
            }
        };
    </script>
</body>
</html>
