<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KGK Online Education | Best Quiz Portal</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <div class="logo"><h2>KGK</h2></div>
        <nav class="nav-links" id="nav-list">
            <a href="index.html">होम</a>
            <span class="auth-trigger" id="open-auth" onclick="checkLogout()">लॉगिन / रजिस्टर</span>
        </nav>
    </header>

    <div class="container" id="main-content" style="display:none;">
        <h2 class="section-title">राजस्थान सामान्य ज्ञान</h2>
        <div class="test-grid">
            <div class="card"><h3>राजस्थान भूगोल</h3><a href="raj-geo.html" class="btn-play">शुरू करें</a></div>
            <div class="card"><h3>राजस्थान इतिहास</h3><a href="raj-hist.html" class="btn-play">शुरू करें</a></div>
        </div>

        <h2 class="section-title">NCERT कक्षाएं</h2>
        <div class="class-btn-container">
            <a href="ncert6.html" class="class-box"><span class="class-num">6</span><span class="class-text">कक्षा</span></a>
            <a href="ncert7.html" class="class-box"><span class="class-num">7</span><span class="class-text">कक्षा</span></a>
            <a href="ncert8.html" class="class-box"><span class="class-num">8</span><span class="class-text">कक्षा</span></a>
        </div>
    </div>

    <div class="modal" id="authModal" style="display: flex;">
        <div class="modal-content auth-card">
            <div class="auth-tabs">
                <button id="login-tab-btn" class="tab-btn active" onclick="switchTab('login')">लॉगिन</button>
                <button id="reg-tab-btn" class="tab-btn" onclick="switchTab('register')">रजिस्टर</button>
            </div>

            <div id="login-section" class="auth-form">
                <div class="input-group"><input type="email" id="login-email" placeholder="ईमेल आईडी"></div>
                <div class="input-group"><input type="password" id="login-pass" placeholder="पासवर्ड"></div>
                <button class="submit-btn glow-button" onclick="handleLogin()">प्रवेश करें</button>
                <p class="auth-footer">पासवर्ड भूल गए? <a href="javascript:void(0)" onclick="showForget()">यहाँ क्लिक करें</a></p>
            </div>

            <div id="forget-section" class="auth-form" style="display:none;">
                <div class="input-group"><input type="email" id="forget-email" placeholder="ईमेल आईडी"></div>
                <button class="submit-btn glow-button" onclick="sendEmailOTP()">OTP भेजें</button>
            </div>

            <div id="otp-section" class="auth-form" style="display:none;">
                <div class="input-group"><input type="text" id="otp-input-field" placeholder="0 0 0 0"></div>
                <button class="submit-btn glow-button" onclick="verifyOTP()">वेरिफाई करें</button>
            </div>

            <div id="reg-section" class="auth-form" style="display:none;">
                <div class="input-group"><input type="text" id="reg-name" placeholder="पूरा नाम"></div>
                <div class="input-group"><input type="email" id="reg-email" placeholder="ईमेल आईडी"></div>
                <div class="input-group"><input type="password" id="reg-pass" placeholder="पासवर्ड"></div>
                <button class="submit-btn glow-button" onclick="handleRegister()">अकाउंट बनाएं</button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <script>emailjs.init("Ff_fHMoX3s88PvoMe");</script>
    <script src="quiz.js"></script>
</body>
</html>
