<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NCERT Class 9 Geography | KGK Online</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <div class="logo"><h2>KGK</h2></div>
        <nav class="nav-links">
            <a href="index.html">होम</a>
            <a href="ncert9-main.html">विषय बदलें</a>
        </nav>
    </header>

    <div class="container" style="max-width: 600px; margin-top: 30px;">
        <div class="card">
            <h4 style="color: #27ae60; margin-bottom: 5px;">NCERT कक्षा 9 - भूगोल</h4>
            <div id="quiz-header" style="display: flex; justify-content: space-between; font-size: 14px; color: #666; margin-bottom: 15px;">
                <span id="q-number">लोड हो रहा है...</span>
                <span id="score-live">स्कोर: 0</span>
            </div>
            
            <hr>

            <div id="quiz-area">
                <h2 id="q-text" style="min-height: 80px; font-size: 20px; color: #fff; margin-top: 20px;">
                    सवाल लोड हो रहा है...
                </h2>
                <div id="options-box"></div>
            </div>

            <button id="next-btn" class="btn-play" style="display:none; width: 100%; border: none; cursor: pointer; font-size: 18px; margin-top: 20px;">
                अगला सवाल
            </button>

            <div id="result-box" style="display:none; padding: 20px; text-align: center;">
                <h2 style="color: #27ae60;">टेस्ट पूरा हुआ!</h2>
                <p style="font-size: 28px; font-weight: bold; color: #fff;">आपका स्कोर: <span id="score-val">0</span></p>
                
                <div style="display: flex; gap: 10px; flex-direction: column; margin-top: 20px;">
                    <button onclick="location.reload()" class="btn-play" style="background: #3498db; border: none;">दोबारा कोशिश करें</button>
                    <a href="ncert9-main.html" class="btn-play" style="background: #7f8c8d; text-decoration: none;">दूसरे विषय चुनें</a>
                </div>
            </div>
        </div>
    </div>

    <script src="quiz.js"></script>

    <script>
        // आपका NCERT Class 9 Geography टैब का विशिष्ट CSV लिंक
        const ncert9GeoURL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRXVXbbQVA_5tojtKMn0VRn_AHY_ZKkeyZ9HHAOvByexslRMfiGq_NXK--FeELRcR7Y5R75FVWc2NbT/pub?gid=486785530&single=true&output=csv";

        window.onload = () => {
            // quiz.js के loadAutoQuestions फ़ंक्शन को कॉल करना
            if (typeof loadAutoQuestions === "function") {
                loadAutoQuestions(ncert9GeoURL);
            } else {
                console.error("quiz.js लोड नहीं हो पाया!");
                document.getElementById('q-text').innerText = "त्रुटी: quiz.js फ़ाइल नहीं मिली!";
            }
        };
    </script>
</body>
</html>
